<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LPIC 101 暗記帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f39800;
    --card: #ffffff;
    --ink: #26282b;
    --sub: #6b6f76;
    --accent: #2f6f4f;
    --accent-bg: #e7f0ea;
    --wrong: #b3432b;
    --wrong-bg: #fbeae5;
    --line: #e2e0da;
    --nav-h: calc(60px + env(safe-area-inset-bottom));
    --header-h: calc(52px + env(safe-area-inset-top));
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: calc(var(--header-h) + 16px) 16px 24px;
  }
  .app-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    background: #7cfc00;
    border: 3px solid #7cfc00;
    box-shadow: 0 4px 16px rgba(0,0,0,.08);
    z-index: 30;
  }
  .app-header .app-title {
    font-family: "DotGothic16", "Hiragino Kaku Gothic ProN", sans-serif;
    font-size: 16px;
    font-weight: 400;
    letter-spacing: .5px;
    color: var(--ink);
  }
  .app {
    width: 100%;
    max-width: 520px;
    padding-bottom: calc(var(--nav-h) + 16px);
  }
  h1 {
    font-size: 18px;
    margin: 0 0 4px;
  }
  .sub {
    color: #fff;
    font-size: 13px;
    margin-bottom: 10px;
  }
  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: #fff;
    margin-bottom: 8px;
  }
  .bar {
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .bar-fill {
    height: 100%;
    background: var(--accent);
    transition: width .3s ease;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 22px;
  }
  #quizArea .card.origin-orig {
    background: #fff4e6;
    border-color: #e8a33d;
  }
  #quizArea .card.origin-new {
    background: #e9f1fb;
    border-color: #3d7dc9;
  }
  .category {
    display: inline-block;
    font-size: 12px;
    color: var(--accent);
    background: var(--accent-bg);
    padding: 3px 10px;
    border-radius: 100px;
    margin-bottom: 12px;
  }
  .question {
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 18px;
    white-space: pre-wrap;
  }
  .choice {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    margin-bottom: 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    font-size: 14px;
    cursor: pointer;
    color: var(--ink);
  }
  .choice:hover { border-color: var(--accent); }
  .choice.correct { background: var(--accent-bg); border-color: var(--accent); }
  .choice.wrong { background: var(--wrong-bg); border-color: var(--wrong); }
  .choice:disabled { cursor: default; }
  .explain {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
    background: var(--bg);
    display: none;
  }
  .explain.show { display: block; }
  .result-label {
    font-weight: bold;
    margin-bottom: 4px;
  }
  .result-label.ok { color: var(--accent); }
  .result-label.ng { color: var(--wrong); }
  .next-btn {
    margin-top: 16px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--ink);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    display: none;
  }
  .next-btn.show { display: block; }
  .finish {
    text-align: center;
    padding: 40px 20px;
  }
  .start-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 22px;
  }
  .field-label {
    font-size: 13px;
    font-weight: bold;
    margin: 0 0 10px;
  }
  .cat-list { margin-bottom: 22px; }
  .cat-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 14px;
    margin-bottom: 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
    font-size: 14px;
  }
  .cat-item:hover { border-color: var(--accent); }
  .cat-item.on {
    background: var(--accent-bg);
    border-color: var(--accent);
  }
  .cat-count {
    font-size: 12px;
    color: var(--sub);
  }
  .cat-item.on .cat-count { color: var(--accent); }
  .count-row {
    display: flex;
    gap: 8px;
    margin-bottom: 22px;
  }
  .count-btn {
    flex: 1;
    padding: 10px 4px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    font-size: 13px;
    cursor: pointer;
    color: var(--ink);
  }
  .count-btn.on {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--accent);
  }
  .start-btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: var(--ink);
    color: #fff;
    font-size: 15px;
    cursor: pointer;
  }
  .start-btn:disabled {
    background: var(--line);
    color: var(--sub);
    cursor: default;
  }
  .quit-btn {
    display: block;
    margin: 14px auto 0;
    padding: 6px 14px;
    border: none;
    background: none;
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
  }
  .finish .score {
    font-size: 36px;
    font-weight: bold;
    color: var(--accent);
    margin: 12px 0;
  }
  .retry-btn {
    margin-top: 16px;
    padding: 10px 20px;
    border: 1px solid var(--ink);
    background: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  .wrong-panel {
    margin-top: 20px;
  }
  .wrong-item {
    background: var(--card);
    border: 1px solid var(--wrong);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 10px;
    text-align: left;
  }
  .wrong-item .question {
    margin: 10px 0 12px;
  }
  .wrong-item .wrong-answer {
    font-size: 13px;
    font-weight: bold;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .wrong-item .wrong-explain {
    font-size: 13px;
    line-height: 1.6;
    color: var(--sub);
  }

  .toptabs {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    gap: 8px;
    width: 100%;
    background: #7cfc00;
    border-top: 1px solid var(--line);
    box-shadow: 0 -4px 16px rgba(0,0,0,.08);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    z-index: 30;
  }
  .toptabs button {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 6px 4px;
    border: none;
    background: transparent;
    font-family: "DotGothic16", "Hiragino Kaku Gothic ProN", sans-serif;
    font-size: 12px;
    cursor: pointer;
    color: rgba(38,40,43,.55);
  }
  .toptabs button .tab-icon {
    font-size: 20px;
    line-height: 1;
  }
  .toptabs button.on {
    color: var(--ink);
    font-weight: 700;
  }
  .page { display: none; }
  .page.on { display: block; }

  .cmd-search-wrap { margin-bottom: 12px; }
  #cmdSearch {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
    background: #fff;
  }
  .cmd-viewtabs {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .cmd-view-btn {
    flex: 1;
    padding: 9px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    font-size: 13px;
    cursor: pointer;
    color: var(--ink);
  }
  .cmd-view-btn.on {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--accent);
  }
  .cmd-hide-btn {
    flex: 1;
    padding: 9px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    font-size: 13px;
    cursor: pointer;
    color: var(--ink);
  }
  .cmd-hide-btn.on {
    background: var(--wrong-bg);
    border-color: var(--wrong);
    color: var(--wrong);
  }
  .cmd-hit {
    font-size: 12px;
    color: #fff;
    margin: 0 0 10px;
  }
  .cmd-list-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 4px 16px;
    margin-bottom: 32px;
  }
  .cmd-col-head {
    display: flex;
    gap: 12px;
    position: sticky;
    top: var(--header-h);
    z-index: 5;
    background: var(--card);
    padding: 8px 2px;
    border-bottom: 2px solid var(--line);
    font-size: 12px;
    font-weight: 700;
    color: var(--sub);
  }
  .cmd-col-head-name { flex: 0 0 28%; }
  .cmd-col-head-opt { flex: 0 0 18%; }
  .cmd-col-head-meaning { flex: 1; }
  .cmd-row {
    display: flex;
    gap: 12px;
    padding: 11px 2px;
    border-bottom: 1px solid var(--line);
    align-items: flex-start;
  }
  .cmd-row:last-child { border-bottom: none; }
  .cmd-row.no-line { border-bottom: none; }
  .cmd-name-col {
    flex: 0 0 28%;
    font-family: "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    word-break: break-word;
  }
  .cmd-opt-col {
    flex: 0 0 18%;
    font-family: "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 11px;
    font-weight: 600;
    word-break: break-word;
  }
  .cmd-opt-col .cmd-opt {
    display: inline-block;
    color: var(--accent);
    background: var(--accent-bg);
    padding: 1px 6px;
    border-radius: 4px;
  }
  .cmd-meaning {
    flex: 1;
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink);
  }
  .cmd-placeholder { display: none; }
  .cmd-maskable.masked, .cmd-meaning.masked {
    cursor: pointer;
  }
  .cmd-maskable.masked .cmd-real, .cmd-meaning.masked .cmd-real-text {
    display: none;
  }
  .cmd-maskable.masked .cmd-placeholder, .cmd-meaning.masked .cmd-placeholder {
    display: inline-block;
    color: var(--sub);
    font-weight: 400;
    border: 1px dashed var(--line);
    border-radius: 6px;
    padding: 3px 10px;
  }
  .cmd-maskable.masked.revealed .cmd-real {
    display: inline;
  }
  .cmd-maskable.masked.revealed .cmd-placeholder {
    display: none;
  }
  .cmd-meaning.masked.revealed .cmd-real-text {
    display: inline;
  }
  .cmd-meaning.masked.revealed .cmd-placeholder {
    display: none;
  }
  .cmd-cat-tag {
    font-size: 11px;
    color: var(--sub);
    margin-top: 4px;
  }
  details.cmd-group {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  details.cmd-group summary {
    padding: 13px 15px;
    font-weight: 600;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    list-style: none;
  }
  details.cmd-group summary::-webkit-details-marker { display: none; }
  details.cmd-group summary span:last-child {
    font-size: 11px;
    color: var(--sub);
    font-weight: 400;
  }
  details.cmd-group > div { padding: 0 15px 4px; }
</style>
</head>
<body>
<header class="app-header">
  <span class="app-title">OneStep</span>
</header>
<div class="app page on" id="page-exam">
  <h1>LPIC101 予想問題集</h1>
  <div class="sub">出題範囲(システム構成・パッケージ管理・コマンド・ファイルシステム)をもとにしたオリジナル問題です</div>

  <div id="startArea">
    <div class="start-card">
      <p class="field-label">出題する分野を選ぶ</p>
      <div class="cat-list" id="catList"></div>

      <p class="field-label">出題数</p>
      <div class="count-row" id="countRow"></div>

      <button class="start-btn" id="startBtn">解き始める</button>
    </div>
  </div>

  <div id="quizArea" style="display:none">
    <div class="progress-row">
      <span id="progressText">1 / 15</span>
      <span id="scoreText">正解 0</span>
    </div>
    <div class="bar"><div class="bar-fill" id="barFill" style="width:0%"></div></div>

    <div class="card" id="quizCard">
      <div class="category" id="category"></div>
      <div class="question" id="question"></div>
      <div id="choices"></div>
      <div class="explain" id="explain">
        <div class="result-label" id="resultLabel"></div>
        <div id="explainText"></div>
      </div>
      <button class="next-btn" id="nextBtn">次の問題へ</button>
    </div>
    <button class="quit-btn" id="quitBtn">分野の選択に戻る</button>
  </div>

  <div id="finishArea" style="display:none">
    <div class="card finish">
      <div>お疲れさまでした</div>
      <div class="score" id="finalScore">0 / 15</div>
      <button class="retry-btn" id="retryBtn">もう一度解く</button>
      <button class="quit-btn" id="backBtn">分野の選択に戻る</button>
    </div>
    <div class="wrong-panel" id="wrongPanel" style="display:none">
      <p class="field-label">間違えた問題</p>
      <div id="wrongList"></div>
    </div>
  </div>
</div>

<div class="app page" id="page-commands">
  <h1>コマンド一覧</h1>
  <div class="sub">LPIC 101 で扱う主要コマンドを分野別・検索付きで確認できます</div>

  <div class="cmd-search-wrap">
    <input type="search" id="cmdSearch" placeholder="コマンド・意味・分野で検索">
  </div>
  <div class="cmd-viewtabs">
    <button class="cmd-view-btn on" data-view="all">一覧</button>
    <button class="cmd-view-btn" data-view="group">分野別</button>
  </div>
  <div class="cmd-viewtabs">
    <button class="cmd-hide-btn" id="hideCmdBtn">コマンドを隠す</button>
    <button class="cmd-hide-btn" id="hideMeaningBtn">説明を隠す</button>
  </div>
  <p class="cmd-hit" id="cmdHit"></p>
  <div class="cmd-list-card">
    <div class="cmd-col-head">
      <div class="cmd-col-head-name">コマンド</div>
      <div class="cmd-col-head-opt">オプション/アクション</div>
      <div class="cmd-col-head-meaning">説明</div>
    </div>
    <div id="cmdAllView"></div>
    <div id="cmdGroupView" style="display:none"></div>
  </div>
</div>

<div class="app page" id="page-frequent">
  <h1>頻出問題</h1>
  <div class="sub">各課題30問・計120問。試験で特に狙われやすい基礎項目に絞った問題集です</div>

  <div id="freqStartArea">
    <div class="start-card">
      <p class="field-label">出題する分野を選ぶ</p>
      <div class="cat-list" id="freqCatList"></div>

      <p class="field-label">出題数</p>
      <div class="count-row" id="freqCountRow"></div>

      <button class="start-btn" id="freqStartBtn">解き始める</button>
    </div>
  </div>

  <div id="freqQuizArea" style="display:none">
    <div class="progress-row">
      <span id="freqProgressText">1 / 15</span>
      <span id="freqScoreText">正解 0</span>
    </div>
    <div class="bar"><div class="bar-fill" id="freqBarFill" style="width:0%"></div></div>

    <div class="card" id="freqQuizCard">
      <div class="category" id="freqCategory"></div>
      <div class="question" id="freqQuestion"></div>
      <div id="freqChoices"></div>
      <div class="explain" id="freqExplain">
        <div class="result-label" id="freqResultLabel"></div>
        <div id="freqExplainText"></div>
      </div>
      <button class="next-btn" id="freqNextBtn">次の問題へ</button>
    </div>
    <button class="quit-btn" id="freqQuitBtn">分野の選択に戻る</button>
  </div>

  <div id="freqFinishArea" style="display:none">
    <div class="card finish">
      <div>お疲れさまでした</div>
      <div class="score" id="freqFinalScore">0 / 15</div>
      <button class="retry-btn" id="freqRetryBtn">もう一度解く</button>
      <button class="quit-btn" id="freqBackBtn">分野の選択に戻る</button>
    </div>
    <div class="wrong-panel" id="freqWrongPanel" style="display:none">
      <p class="field-label">間違えた問題</p>
      <div id="freqWrongList"></div>
    </div>
  </div>
</div>

<footer class="toptabs">
  <button class="on" data-page="exam">
    <span class="tab-icon">📝</span>
    <span class="tab-label">予想問題</span>
  </button>
  <button data-page="commands">
    <span class="tab-icon">⌨️</span>
    <span class="tab-label">コマンド</span>
  </button>
  <button data-page="frequent">
    <span class="tab-icon">🔥</span>
    <span class="tab-label">頻出問題</span>
  </button>
</footer>

<script>
const OLD_QUESTIONS = [
  {
    category: "課題101: システムアーキテクチャ",
    question: "PCの電源を入れてから最初に実行され、ハードウェアの初期化を行うファームウェアはどれか。",
    choices: ["GRUB", "BIOS/UEFI", "systemd", "init"],
    answer: 1,
    explain: "BIOS/UEFIは電源投入後に最初に動作するファームウェアで、ハードウェアチェック後にブートローダーを呼び出します。GRUBはその後に起動するブートローダーです。"
  },
  {
    category: "課題101: システムアーキテクチャ",
    question: "現在起動しているLinuxのランレベル(または対応するsystemdのターゲット)を確認するコマンドはどれか。",
    choices: ["runlevel", "uptime", "hostname", "uname -r"],
    answer: 0,
    explain: "runlevelコマンドで現在および直前のランレベルを確認できます。systemd環境ではsystemctl get-defaultも使われます。"
  },
  {
    category: "課題101: システムアーキテクチャ",
    question: "/proc/cpuinfo に格納されている情報として正しいものはどれか。",
    choices: ["ディスクの使用量", "CPUの詳細情報", "ネットワーク設定", "起動中のプロセス一覧"],
    answer: 1,
    explain: "/proc/cpuinfoにはCPUのモデル名やコア数、フラグなどの情報が格納されています。/procは実行中のカーネル情報を参照する仮想ファイルシステムです。"
  },
  {
    category: "課題102: Linuxのインストールとパッケージ管理",
    question: "Debian系ディストリビューションで依存関係を自動解決しながらパッケージをインストールするコマンドはどれか。",
    choices: ["rpm -i", "dpkg -i", "apt install", "yum install"],
    answer: 2,
    explain: "apt installは依存パッケージを自動的に解決してインストールします。dpkgは低レベルツールで依存関係の自動解決は行いません。"
  },
  {
    category: "課題102: Linuxのインストールとパッケージ管理",
    question: "RPM系ディストリビューションで、すでにインストール済みのパッケージ一覧を表示するコマンドはどれか。",
    choices: ["rpm -qa", "rpm -e", "dpkg -l", "apt list"],
    answer: 0,
    explain: "rpm -qaはインストール済みの全パッケージを一覧表示します。-eはパッケージの削除(erase)オプションです。"
  },
  {
    category: "課題102: Linuxのインストールとパッケージ管理",
    question: "dpkgコマンドでパッケージを完全に削除(設定ファイルも含む)するオプションはどれか。",
    choices: ["-r", "-P", "-i", "-l"],
    answer: 1,
    explain: "dpkg -P(--purge)は設定ファイルも含めて完全にパッケージを削除します。-r(--remove)は設定ファイルを残して削除します。"
  },
  {
    category: "課題103: GNUとUNIXコマンド",
    question: "ファイル内から特定の文字列を含む行を検索するコマンドはどれか。",

const questions = [
  ...OLD_QUESTIONS.map(q => ({ ...q, origin: "orig" })),
  ...NEW_QUESTIONS.map(q => ({ ...q, origin: "new" }))
];

let current = 0;
let score = 0;
let answered = false;

const quizCardEl = document.getElementById("quizCard");
const categoryEl = document.getElementById("category");
const questionEl = document.getElementById("question");
const choicesEl = document.getElementById("choices");
const explainEl = document.getElementById("explain");
const explainTextEl = document.getElementById("explainText");
const resultLabelEl = document.getElementById("resultLabel");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const scoreText = document.getElementById("scoreText");
const barFill = document.getElementById("barFill");
const quizArea = document.getElementById("quizArea");
const finishArea = document.getElementById("finishArea");
const finalScore = document.getElementById("finalScore");
const startArea = document.getElementById("startArea");
const catList = document.getElementById("catList");
const countRow = document.getElementById("countRow");
const startBtn = document.getElementById("startBtn");
const wrongPanel = document.getElementById("wrongPanel");
const wrongList = document.getElementById("wrongList");

const CATEGORIES = [...new Set(questions.map(q => q.category))];
const COUNT_OPTIONS = [10, 20, 30, "全部"];

let selectedCats = new Set();
let selectedCount = 10;
let quizSet = [];
let wrongAnswers = [];

function renderStart() {
  catList.innerHTML = "";
  CATEGORIES.forEach(cat => {
    const total = questions.filter(q => q.category === cat).length;
    const item = document.createElement("button");
    item.className = "cat-item" + (selectedCats.has(cat) ? " on" : "");
    item.innerHTML = `<span>${cat}</span><span class="cat-count">${total}問</span>`;
    item.addEventListener("click", () => {
      if (selectedCats.has(cat)) selectedCats.delete(cat);
      else selectedCats.add(cat);
      renderStart();
    });
    catList.appendChild(item);
  });

  countRow.innerHTML = "";
  COUNT_OPTIONS.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "count-btn" + (selectedCount === opt ? " on" : "");
    btn.textContent = opt === "全部" ? "70問" : `${opt}問`;
    btn.addEventListener("click", () => {
      selectedCount = opt;
      renderStart();
    });
    countRow.appendChild(btn);
  });

  const available = questions.filter(q => selectedCats.has(q.category)).length;
  startBtn.disabled = available === 0;
  startBtn.textContent = available === 0
    ? "分野を1つ以上選んでください"
    : `解き始める(${available}問から出題)`;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderWrongList(panelEl, listEl, wrongs) {
  listEl.innerHTML = "";
  if (wrongs.length === 0) {
    panelEl.style.display = "none";
    return;
  }
  panelEl.style.display = "block";
  wrongs.forEach(q => {
    const item = document.createElement("div");
    item.className = "wrong-item";
    const cat = document.createElement("div");
    cat.className = "category";
    cat.textContent = q.category;
    const question = document.createElement("div");
    question.className = "question";
    question.textContent = q.question;
    const answer = document.createElement("div");
    answer.className = "wrong-answer";
    answer.textContent = "正解: " + q.choices[q.answer];
    const explain = document.createElement("div");
    explain.className = "wrong-explain";
    explain.textContent = q.explain;
    item.append(cat, question, answer, explain);
    listEl.appendChild(item);
  });
}

function startQuiz() {
  const pool = shuffle(questions.filter(q => selectedCats.has(q.category)));
  quizSet = selectedCount === "全部" ? pool : pool.slice(0, selectedCount);
  current = 0;
  score = 0;
  wrongAnswers = [];
  startArea.style.display = "none";
  finishArea.style.display = "none";
  quizArea.style.display = "block";
  renderQuestion();
}

function backToStart() {
  quizArea.style.display = "none";
  finishArea.style.display = "none";
  startArea.style.display = "block";
  renderStart();
}

function renderQuestion() {
  answered = false;
  const q = quizSet[current];
  quizCardEl.classList.remove("origin-orig", "origin-new");
  quizCardEl.classList.add(q.origin === "new" ? "origin-new" : "origin-orig");
  categoryEl.textContent = q.category;
  questionEl.textContent = q.question;
  choicesEl.innerHTML = "";
  explainEl.classList.remove("show");
  nextBtn.classList.remove("show");

  q.choices.forEach((choiceText, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.textContent = choiceText;
    btn.addEventListener("click", () => selectChoice(i));
    choicesEl.appendChild(btn);
  });

  progressText.textContent = `${current + 1} / ${quizSet.length}`;
  scoreText.textContent = `正解 ${score}`;
  barFill.style.width = `${(current / quizSet.length) * 100}%`;
}

function selectChoice(i) {
  if (answered) return;
  answered = true;
  const q = quizSet[current];
  const buttons = choicesEl.querySelectorAll(".choice");
  buttons.forEach((b, idx) => {
    b.disabled = true;
    if (idx === q.answer) b.classList.add("correct");
    else if (idx === i) b.classList.add("wrong");
  });

  if (i === q.answer) {
    score++;
    resultLabelEl.textContent = "正解";
    resultLabelEl.className = "result-label ok";
  } else {
    resultLabelEl.textContent = "不正解";
    resultLabelEl.className = "result-label ng";
    wrongAnswers.push(q);
  }
  explainTextEl.textContent = q.explain;
  explainEl.classList.add("show");
  nextBtn.classList.add("show");
  scoreText.textContent = `正解 ${score}`;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizSet.length) {
    renderQuestion();
  } else {
    barFill.style.width = "100%";
    quizArea.style.display = "none";
    finishArea.style.display = "block";
    finalScore.textContent = `${score} / ${quizSet.length}`;
    renderWrongList(wrongPanel, wrongList, wrongAnswers);
  }
});

document.getElementById("retryBtn").addEventListener("click", startQuiz);
document.getElementById("quitBtn").addEventListener("click", backToStart);
document.getElementById("backBtn").addEventListener("click", backToStart);
startBtn.addEventListener("click", startQuiz);

renderStart();

const cmdSearchEl = document.getElementById("cmdSearch");
const cmdHitEl = document.getElementById("cmdHit");
const cmdAllViewEl = document.getElementById("cmdAllView");
const cmdGroupViewEl = document.getElementById("cmdGroupView");
const hideCmdBtn = document.getElementById("hideCmdBtn");
const hideMeaningBtn = document.getElementById("hideMeaningBtn");
let cmdView = "all";
let hideCmdText = false;
let hideMeaningText = false;

function cmdCategories() {
  const list = [];
  COMMANDS.forEach(c => { if (!list.includes(c.c)) list.push(c.c); });
  return list;
}

function cmdMatches(c, q) {
  return !q
    || c.cmd.toLowerCase().includes(q)
    || (c.opt && c.opt.toLowerCase().includes(q))
    || c.a.toLowerCase().includes(q)
    || c.c.toLowerCase().includes(q);
}

function buildCmdRow(c, sameAsNext, continuation) {
  const row = document.createElement("div");
  row.className = "cmd-row" + (sameAsNext ? " no-line" : "");

  const nameCol = document.createElement("div");
  nameCol.className = "cmd-name-col";
  if (!continuation) {
    nameCol.classList.add("cmd-maskable");
    if (hideCmdText) nameCol.classList.add("masked");
    const nameReal = document.createElement("span");
    nameReal.className = "cmd-real";
    nameReal.textContent = c.cmd;
    const namePlaceholder = document.createElement("span");
    namePlaceholder.className = "cmd-placeholder";
    namePlaceholder.textContent = "タップして表示";
    nameCol.append(nameReal, namePlaceholder);
    if (hideCmdText) {
      nameCol.addEventListener("click", () => nameCol.classList.toggle("revealed"));
    }
  }

  const optCol = document.createElement("div");
  optCol.className = "cmd-opt-col cmd-maskable" + (hideCmdText ? " masked" : "");
  if (c.opt) {
    const optReal = document.createElement("span");
    optReal.className = "cmd-real cmd-opt";
    optReal.textContent = c.opt;
    const optPlaceholder = document.createElement("span");
    optPlaceholder.className = "cmd-placeholder";
    optPlaceholder.textContent = "タップして表示";
    optCol.append(optReal, optPlaceholder);
  }

  if (hideCmdText) {
    optCol.addEventListener("click", () => optCol.classList.toggle("revealed"));
  }

  const meaning = document.createElement("div");
  meaning.className = "cmd-meaning" + (hideMeaningText ? " masked" : "");
  const meaningReal = document.createElement("span");
  meaningReal.className = "cmd-real-text";
  meaningReal.textContent = c.a;
  const meaningPlaceholder = document.createElement("span");
  meaningPlaceholder.className = "cmd-placeholder";
  meaningPlaceholder.textContent = "タップして表示";
  meaning.append(meaningReal, meaningPlaceholder);
  if (hideMeaningText) {
    meaning.addEventListener("click", () => meaning.classList.toggle("revealed"));
  }
  const tag = document.createElement("div");
  tag.className = "cmd-cat-tag";
  tag.textContent = c.c;
  meaning.appendChild(tag);

  row.append(nameCol, optCol, meaning);
  return row;
}

function renderCmdAll(q) {
  const rows = COMMANDS.filter(c => cmdMatches(c, q));
  cmdHitEl.textContent = rows.length + " 件";
  cmdAllViewEl.innerHTML = "";
  rows.forEach((c, i) => {
    const sameAsNext = i < rows.length - 1 && rows[i + 1].cmd === c.cmd;
    const continuation = i > 0 && rows[i - 1].cmd === c.cmd;
    cmdAllViewEl.appendChild(buildCmdRow(c, sameAsNext, continuation));
  });
}

function renderCmdGroup(q) {
  cmdGroupViewEl.innerHTML = "";
  let total = 0;
  cmdCategories().forEach(cat => {
    const items = COMMANDS.filter(c => c.c === cat && cmdMatches(c, q));
    if (!items.length) return;
    total += items.length;
    const det = document.createElement("details");
    det.className = "cmd-group";
    if (q) det.open = true;
    const sum = document.createElement("summary");
    const label = document.createElement("span");
    label.textContent = cat;
    const count = document.createElement("span");
    count.textContent = items.length + "件";
    sum.append(label, count);
    const inner = document.createElement("div");
    items.forEach((c, i) => {
      const sameAsNext = i < items.length - 1 && items[i + 1].cmd === c.cmd;
      const continuation = i > 0 && items[i - 1].cmd === c.cmd;
      inner.appendChild(buildCmdRow(c, sameAsNext, continuation));
    });
    det.append(sum, inner);
    cmdGroupViewEl.appendChild(det);
  });
  cmdHitEl.textContent = total + " 件";
}

function renderCmd() {
  const q = cmdSearchEl.value.trim().toLowerCase();
  if (cmdView === "all") {
    cmdAllViewEl.style.display = "block";
    cmdGroupViewEl.style.display = "none";
    renderCmdAll(q);
  } else {
    cmdAllViewEl.style.display = "none";
    cmdGroupViewEl.style.display = "block";
    renderCmdGroup(q);
  }
}

cmdSearchEl.addEventListener("input", renderCmd);
document.querySelectorAll(".cmd-view-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".cmd-view-btn").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
    cmdView = btn.dataset.view;
    renderCmd();
  });
});
hideCmdBtn.addEventListener("click", () => {
  hideCmdText = !hideCmdText;
  hideCmdBtn.classList.toggle("on", hideCmdText);
  renderCmd();
});
hideMeaningBtn.addEventListener("click", () => {
  hideMeaningText = !hideMeaningText;
  hideMeaningBtn.classList.toggle("on", hideMeaningText);
  renderCmd();
});

renderCmd();

const freqCategoryEl = document.getElementById("freqCategory");
const freqQuestionEl = document.getElementById("freqQuestion");
const freqChoicesEl = document.getElementById("freqChoices");
const freqExplainEl = document.getElementById("freqExplain");
const freqExplainTextEl = document.getElementById("freqExplainText");
const freqResultLabelEl = document.getElementById("freqResultLabel");
const freqNextBtn = document.getElementById("freqNextBtn");
const freqProgressText = document.getElementById("freqProgressText");
const freqScoreText = document.getElementById("freqScoreText");
const freqBarFill = document.getElementById("freqBarFill");
const freqQuizArea = document.getElementById("freqQuizArea");
const freqFinishArea = document.getElementById("freqFinishArea");
const freqFinalScore = document.getElementById("freqFinalScore");
const freqStartArea = document.getElementById("freqStartArea");
const freqCatList = document.getElementById("freqCatList");
const freqCountRow = document.getElementById("freqCountRow");
const freqStartBtn = document.getElementById("freqStartBtn");
const freqWrongPanel = document.getElementById("freqWrongPanel");
const freqWrongList = document.getElementById("freqWrongList");

const FREQ_CATEGORIES = [...new Set(FREQ_QUESTIONS.map(q => q.category))];
const FREQ_COUNT_OPTIONS = [10, 20, 30, "全部"];

let freqSelectedCats = new Set();
let freqSelectedCount = 20;
let freqQuizSet = [];
let freqCurrent = 0;
let freqScore = 0;
let freqAnswered = false;
let freqWrongAnswers = [];

function renderFreqStart() {
  freqCatList.innerHTML = "";
  FREQ_CATEGORIES.forEach(cat => {
    const total = FREQ_QUESTIONS.filter(q => q.category === cat).length;
    const item = document.createElement("button");
    item.className = "cat-item" + (freqSelectedCats.has(cat) ? " on" : "");
    item.innerHTML = `<span>${cat}</span><span class="cat-count">${total}問</span>`;
    item.addEventListener("click", () => {
      if (freqSelectedCats.has(cat)) freqSelectedCats.delete(cat);
      else freqSelectedCats.add(cat);
      renderFreqStart();
    });
    freqCatList.appendChild(item);
  });

  freqCountRow.innerHTML = "";
  FREQ_COUNT_OPTIONS.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "count-btn" + (freqSelectedCount === opt ? " on" : "");
    btn.textContent = opt === "全部" ? "全部" : `${opt}問`;
    btn.addEventListener("click", () => {
      freqSelectedCount = opt;
      renderFreqStart();
    });
    freqCountRow.appendChild(btn);
  });

  const available = FREQ_QUESTIONS.filter(q => freqSelectedCats.has(q.category)).length;
  freqStartBtn.disabled = available === 0;
  freqStartBtn.textContent = available === 0
    ? "分野を1つ以上選んでください"
    : `解き始める(${available}問から出題)`;
}

function startFreqQuiz() {
  const pool = shuffle(FREQ_QUESTIONS.filter(q => freqSelectedCats.has(q.category)));
  freqQuizSet = freqSelectedCount === "全部" ? pool : pool.slice(0, freqSelectedCount);
  freqCurrent = 0;
  freqScore = 0;
  freqWrongAnswers = [];
  freqStartArea.style.display = "none";
  freqFinishArea.style.display = "none";
  freqQuizArea.style.display = "block";
  renderFreqQuestion();
}

function backToFreqStart() {
  freqQuizArea.style.display = "none";
  freqFinishArea.style.display = "none";
  freqStartArea.style.display = "block";
  renderFreqStart();
}

function renderFreqQuestion() {
  freqAnswered = false;
  const q = freqQuizSet[freqCurrent];
  freqCategoryEl.textContent = q.category;
  freqQuestionEl.textContent = q.question;
  freqChoicesEl.innerHTML = "";
  freqExplainEl.classList.remove("show");
  freqNextBtn.classList.remove("show");

  q.choices.forEach((choiceText, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.textContent = choiceText;
    btn.addEventListener("click", () => selectFreqChoice(i));
    freqChoicesEl.appendChild(btn);
  });

  freqProgressText.textContent = `${freqCurrent + 1} / ${freqQuizSet.length}`;
  freqScoreText.textContent = `正解 ${freqScore}`;
  freqBarFill.style.width = `${(freqCurrent / freqQuizSet.length) * 100}%`;
}

function selectFreqChoice(i) {
  if (freqAnswered) return;
  freqAnswered = true;
  const q = freqQuizSet[freqCurrent];
  const buttons = freqChoicesEl.querySelectorAll(".choice");
  buttons.forEach((b, idx) => {
    b.disabled = true;
    if (idx === q.answer) b.classList.add("correct");
    else if (idx === i) b.classList.add("wrong");
  });

  if (i === q.answer) {
    freqScore++;
    freqResultLabelEl.textContent = "正解";
    freqResultLabelEl.className = "result-label ok";
  } else {
    freqResultLabelEl.textContent = "不正解";
    freqResultLabelEl.className = "result-label ng";
    freqWrongAnswers.push(q);
  }
  freqExplainTextEl.textContent = q.explain;
  freqExplainEl.classList.add("show");
  freqNextBtn.classList.add("show");
  freqScoreText.textContent = `正解 ${freqScore}`;
}

freqNextBtn.addEventListener("click", () => {
  freqCurrent++;
  if (freqCurrent < freqQuizSet.length) {
    renderFreqQuestion();
  } else {
    freqBarFill.style.width = "100%";
    freqQuizArea.style.display = "none";
    freqFinishArea.style.display = "block";
    freqFinalScore.textContent = `${freqScore} / ${freqQuizSet.length}`;
    renderWrongList(freqWrongPanel, freqWrongList, freqWrongAnswers);
  }
});

document.getElementById("freqRetryBtn").addEventListener("click", startFreqQuiz);
document.getElementById("freqQuitBtn").addEventListener("click", backToFreqStart);
document.getElementById("freqBackBtn").addEventListener("click", backToFreqStart);
freqStartBtn.addEventListener("click", startFreqQuiz);

renderFreqStart();

/* ============================================================
   ページ上部タブ(予想問題 / コマンド / 頻出問題)の切り替え
   ============================================================ */
document.querySelectorAll(".toptabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".toptabs button").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
    document.querySelectorAll(".page").forEach(p => p.classList.remove("on"));
    document.getElementById("page-" + btn.dataset.page).classList.add("on");
    window.scrollTo(0, 0);
  });
});
</script>
