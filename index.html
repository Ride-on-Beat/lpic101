<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マイ・ミュージックライブラリー</title>
<script src="vendor/jsmediatags.min.js"></script>
<style>
/* =========================================================
   配色：青紫を土台に、緑を「今鳴っている場所」だけに使う
   ========================================================= */
:root{
  --bg:#15112E;
  --panel:#1D1743;
  --side:#100D25;
  --raise:#251E52;
  --line:rgba(190,180,255,.14);
  --hover:rgba(150,135,255,.12);

  --violet:#7a99cf;
  --violet-soft:#A79BFF;
  --violet-deep:#4B3BC7;

  --green:#7cfc00;          /* 前回より緑寄りに */
  --green-deep:#2FA94E;
  --green-glow:rgba(78,214,110,.16);
  --on-green:#062012;

  --text:#EEEBFF;
  --sub:#948DC4;
  --bar-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Segoe UI","Yu Gothic UI","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  color:var(--text);background:var(--bg);font-size:14px;overflow:hidden;
}
button,select,input{font-family:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--green);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(160,145,255,.28);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:rgba(160,145,255,.45)}
::-webkit-scrollbar-track{background:transparent}

#app{display:flex;flex-direction:column;height:100vh}
.titlebar{
  height:46px;flex:none;display:flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(90deg,var(--violet) 35%,var(--green) 65%);
  font-size:15px;letter-spacing:.07em;user-select:none;color:#fff;
}
.titlebar svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:1.7}
.transport{height:var(--bar-h);flex:none;display:flex;align-items:center;gap:4px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);position:relative}
.body{flex:1;display:flex;min-height:0}

.tbtn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--violet-soft)}
.tbtn:hover{background:var(--hover);color:#fff}
.tbtn.on{color:var(--green);background:var(--green-glow)}
.tbtn svg{width:20px;height:20px;fill:currentColor}
.tbtn.play{width:46px;height:46px;background:linear-gradient(135deg,var(--violet),var(--violet-deep));color:#fff;box-shadow:0 3px 14px rgba(124,107,255,.45)}
.tbtn.play:hover{filter:brightness(1.12)}
.tbtn.play svg{width:24px;height:24px}

.nowbox{flex:1;display:flex;align-items:center;gap:12px;min-width:0;padding:0 18px}
.nowart{width:44px;height:44px;flex:none;border-radius:5px;background:var(--raise);object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.nowtext{width:190px;flex:none;min-width:0}
.nowtitle{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowartist{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seekwrap{flex:1;display:flex;align-items:center;gap:10px;min-width:120px}
.time{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;flex:none}
.badges{display:flex;gap:6px;flex:none}
.badge{font-size:10px;letter-spacing:.06em;padding:2px 7px;border-radius:9px;border:1px solid var(--green);color:var(--green);opacity:0;transition:opacity .3s}
.badge.show{opacity:1}

input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:16px;cursor:pointer;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--green) var(--p),rgba(255,255,255,.16) var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.16)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--green)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--green);margin-top:-4px;box-shadow:0 0 0 4px rgba(78,214,110,.22)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:none;border-radius:50%;background:var(--green)}
.volwrap{display:flex;align-items:center;gap:6px;width:126px;flex:none}

.sidebar{width:252px;flex:none;background:var(--side);border-right:1px solid var(--line);overflow-y:auto;padding-bottom:24px}
.sec{font-size:11px;color:var(--sub);padding:16px 16px 6px;letter-spacing:.06em}
.nav{width:100%;display:flex;align-items:center;gap:12px;padding:9px 16px;font-size:14px;text-align:left;border-left:3px solid transparent;color:var(--text)}
.nav svg+span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav:hover{background:var(--hover)}
.nav.active{background:linear-gradient(90deg,rgba(124,107,255,.24),transparent);border-left-color:var(--green)}
.nav.active svg{stroke:var(--green)}
.nav svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--violet-soft);stroke-width:1.6}
.nav .count{margin-left:auto;font-size:11px;color:var(--sub)}
.nav .x{margin-left:auto;font-size:15px;color:var(--sub);padding:0 4px;visibility:hidden}
.nav:hover .x{visibility:visible}
.nav .x:hover{color:#FF7A7A}

.addbtn{margin:8px 16px 0;width:calc(100% - 32px);border:1px solid rgba(160,145,255,.35);border-radius:7px;background:rgba(124,107,255,.12);padding:10px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--violet-soft)}
.addbtn:hover{background:rgba(124,107,255,.26);color:#fff;border-color:var(--violet)}
.addbtn.small{padding:7px;font-size:12px;margin-top:6px}
.addbtn span,.sendrow span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.roots{padding:4px 16px 0;font-size:11px;color:var(--sub);line-height:1.7}
.roots div{display:flex;align-items:center;gap:6px}
.roots .dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex:none}
.roots .dot.off{background:#8A7FC0}
.sendrow{width:100%;display:flex;align-items:center;gap:12px;padding:9px 16px;font-size:14px;border-left:3px solid transparent}
.sendrow:hover{background:var(--hover)}
.sendrow svg{width:18px;height:18px;fill:none;stroke:var(--violet-soft);stroke-width:1.6}
.sendrow .arrow{margin-left:auto;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--green-deep));display:flex;align-items:center;justify-content:center}
.sendrow .arrow svg{width:13px;height:13px;fill:#fff;stroke:none}

main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--panel)}
.toolbar{height:58px;flex:none;display:flex;align-items:center;padding:0 24px;gap:14px;border-bottom:1px solid var(--line)}
.vtitle{font-size:17px;font-weight:600}
.vsub{font-size:12px;color:var(--sub)}
.search{margin-left:auto;width:280px;height:32px;border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;gap:8px;padding:0 14px;background:rgba(0,0,0,.22)}
.search:focus-within{border-color:var(--green)}
.search svg{width:15px;height:15px;fill:none;stroke:var(--sub);stroke-width:2}
.search input{border:none;outline:none;flex:1;font-size:13px;background:none}
.sortsel{border:1px solid var(--line);border-radius:6px;height:31px;padding:0 8px;font-size:12px;background:var(--raise);color:var(--text)}
.content{flex:1;overflow-y:auto;padding:20px 24px 40px}

.relink{margin:-20px -24px 20px;padding:11px 24px;background:var(--green-glow);border-bottom:1px solid rgba(78,214,110,.3);font-size:12.5px;display:flex;align-items:center;gap:14px}
.relink strong{color:var(--green)}
.relink button{background:var(--green);color:var(--on-green);border-radius:5px;padding:6px 14px;font-size:12px;font-weight:600}
.relink button:hover{filter:brightness(1.1)}

.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--sub)}
.empty svg{width:104px;height:104px;fill:none;stroke:rgba(160,145,255,.35);stroke-width:1.3}
.empty p{font-size:15px}
.empty .hint{font-size:12px;max-width:400px;text-align:center;line-height:1.8;opacity:.75}

table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:11px;color:var(--sub);font-weight:400;padding:0 10px 8px;border-bottom:1px solid var(--line);position:sticky;top:-20px;background:var(--panel);z-index:2}
tbody tr{border-bottom:1px solid rgba(255,255,255,.05)}
tbody tr:hover{background:var(--hover)}
tbody tr.playing{background:var(--green-glow)}
tbody tr.playing td{color:var(--green)}
tbody tr.unlinked td:not(.act){opacity:.4}
td{padding:8px 10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0}
td.num{width:54px;color:var(--sub);font-variant-numeric:tabular-nums;text-align:right;padding-right:14px}
td.dur{width:62px;color:var(--sub);font-variant-numeric:tabular-nums;text-align:right}
td.lv{width:56px;color:var(--sub);font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
td.act{width:38px;max-width:38px;text-align:center;color:var(--sub);padding:0}
td.act button{width:26px;height:26px;border-radius:50%;font-size:15px;line-height:1;visibility:hidden}
tr:hover td.act button{visibility:visible}
td.act button:hover{background:var(--raise);color:var(--green)}
.playcell{display:flex;align-items:center;gap:10px}
.mini{width:32px;height:32px;border-radius:3px;background:var(--raise);object-fit:cover;flex:none}
.eqbar{display:inline-flex;gap:2px;align-items:flex-end;height:12px;width:12px}
.eqbar i{width:2px;background:var(--green);animation:eq .9s ease-in-out infinite}
.eqbar i:nth-child(2){animation-delay:.15s}.eqbar i:nth-child(3){animation-delay:.3s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}

.grid{display:grid;gap:26px 20px;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));user-select:none}
.card{position:relative;cursor:pointer;text-align:left}
.jacket{width:100%;aspect-ratio:1;border-radius:5px;background:var(--raise);object-fit:cover;display:block;box-shadow:0 4px 14px rgba(0,0,0,.45);transition:transform .18s,box-shadow .18s}
.card:hover .jacket{transform:translateY(-4px);box-shadow:0 10px 26px rgba(0,0,0,.6),0 0 0 1px rgba(78,214,110,.5)}
.card.sel .jacket{box-shadow:0 0 0 3px var(--green),0 10px 26px rgba(0,0,0,.6)}
.card .chk{display:none;position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--green);color:var(--on-green);align-items:center;justify-content:center;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.card.sel .chk{display:flex}
.selbar{margin:-20px -24px 20px;padding:11px 24px;background:rgba(124,107,255,.14);border-bottom:1px solid var(--line);font-size:12.5px;display:flex;align-items:center;gap:14px}
.selbar strong{color:var(--violet-soft)}
.selrect{position:fixed;border:1px solid var(--green);background:rgba(124,214,0,.15);pointer-events:none;z-index:65}
.ctitle{margin-top:9px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csub{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.noart{display:flex;align-items:center;justify-content:center;color:rgba(160,145,255,.4)}
.noart svg{width:44%;height:44%;fill:none;stroke:currentColor;stroke-width:1.4}

.detail{display:flex;gap:28px;margin-bottom:24px}
.detail .jacket{width:196px;flex:none}
.dinfo{padding-top:6px}
.dinfo h2{font-size:22px;margin-bottom:6px}
.dinfo .meta{color:var(--sub);font-size:13px;margin-bottom:16px}
.pill{border-radius:20px;padding:9px 22px;font-size:13px;display:inline-flex;align-items:center;gap:8px;margin-right:8px}
.pill.primary{background:var(--green);color:var(--on-green);font-weight:600}
.pill.primary:hover{filter:brightness(1.1)}
.pill.ghost{border:1px solid rgba(160,145,255,.4);color:var(--violet-soft)}
.pill.ghost:hover{background:var(--hover);color:#fff}
.pill svg{width:14px;height:14px;fill:currentColor}
.back{font-size:12px;color:var(--sub);margin-bottom:14px;display:inline-flex;gap:6px;align-items:center}
.back:hover{color:var(--green)}

.menu{position:fixed;background:var(--raise);border:1px solid var(--line);border-radius:9px;box-shadow:0 14px 40px rgba(0,0,0,.6);padding:6px;z-index:60;min-width:196px}
.menu button{display:block;width:100%;text-align:left;padding:8px 12px;font-size:13px;border-radius:6px}
.menu button:hover{background:var(--hover);color:var(--green)}
.menu hr{border:none;border-top:1px solid var(--line);margin:5px 0}
.menu .head{font-size:11px;color:var(--sub);padding:5px 12px}

.settings{position:absolute;right:12px;top:calc(var(--bar-h) - 4px);width:320px;background:var(--raise);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 44px rgba(0,0,0,.6);padding:18px;z-index:55;max-height:70vh;overflow:auto}
.settings h4{font-size:12px;margin:0 0 12px;color:var(--green);letter-spacing:.08em}
.settings h4.mt{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;font-size:13px}
.sw{width:42px;height:23px;border-radius:12px;background:rgba(255,255,255,.16);position:relative;flex:none;transition:background .2s;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--green)}
.sw.on::after{transform:translateX(19px)}
.settings .val{color:var(--green);font-variant-numeric:tabular-nums;font-size:12px}
.settings p{font-size:11.5px;color:var(--sub);line-height:1.75;margin-top:10px}
.settings .go{width:100%;margin-top:10px;background:var(--green);color:var(--on-green);border-radius:7px;padding:9px;font-size:12.5px;font-weight:600}
.settings .go:disabled{background:rgba(255,255,255,.12);color:var(--sub);font-weight:400;cursor:default}

.mask{position:fixed;inset:0;background:rgba(8,5,24,.7);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:70}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(560px,92vw);max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.7)}
.dlg h3{font-size:16px;padding:18px 22px;border-bottom:1px solid var(--line)}
.dlg .in{padding:20px 22px;display:flex;gap:20px}
.dlg .fields{flex:1;display:grid;gap:12px}
.fld{display:grid;gap:5px}
.fld label{font-size:11px;color:var(--sub)}
.fld input,.fld select{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;outline:none;background:rgba(0,0,0,.28);color:var(--text)}
.fld input:focus{border-color:var(--green)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.artbox{width:150px;flex:none;text-align:center}
.artbox .jacket{width:150px;margin-bottom:8px}
.dlg .foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.btn{border-radius:7px;padding:9px 20px;font-size:13px}
.btn.primary{background:var(--green);color:var(--on-green);font-weight:600}
.btn.primary:hover{filter:brightness(1.1)}
.btn.primary:disabled{background:rgba(255,255,255,.14);color:var(--sub);cursor:not-allowed;font-weight:400}
.btn.ghost{border:1px solid rgba(160,145,255,.4);color:var(--violet-soft)}
.btn.ghost:hover{background:var(--hover)}
.tip{font-size:11.5px;color:var(--sub);line-height:1.75;padding:0 22px 16px}

.loading{position:fixed;left:0;right:0;bottom:0;background:var(--violet-deep);color:#fff;padding:10px 22px;font-size:12px;display:flex;align-items:center;gap:14px;z-index:80}
.loading .track{flex:1;height:4px;background:rgba(255,255,255,.24);border-radius:2px;overflow:hidden}
.loading .fill{height:100%;width:0;background:var(--green);transition:width .2s}

.panel{max-width:640px}
.panel h2{font-size:18px;margin-bottom:14px}
.panel p{line-height:1.9;margin-bottom:14px;font-size:13px}
.panel .note{background:rgba(124,107,255,.14);border-left:3px solid var(--violet);padding:14px 16px;font-size:13px;line-height:1.9;margin-bottom:16px;border-radius:0 8px 8px 0}
.panel code{background:rgba(0,0,0,.35);padding:1px 6px;border-radius:3px;font-size:12px;color:var(--green)}
#sendlog{margin-top:16px;font-size:12px;color:var(--sub);line-height:1.8;white-space:pre-wrap}

.devices{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));margin-bottom:18px}
.devcard{border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;background:rgba(255,255,255,.03)}
.devcard:hover{border-color:var(--green);background:rgba(78,214,110,.08)}
.devcard.sel{border-color:var(--green);background:var(--green-glow)}
.devcard .dname{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.devcard .dname svg{width:16px;height:16px;fill:none;stroke:var(--green);stroke-width:1.8;flex:none}
.devcard .dmeta{font-size:11.5px;color:var(--sub);margin-top:5px}
.devcard .dbar{height:4px;border-radius:2px;background:rgba(255,255,255,.14);margin-top:8px;overflow:hidden}
.devcard .dbar i{display:block;height:100%;background:var(--violet-soft)}
.devwait{font-size:12.5px;color:var(--sub);display:flex;align-items:center;gap:10px;margin-bottom:18px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(160,145,255,.3);border-top-color:var(--violet-soft);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:900px){
  .sidebar{width:66px}
  .sidebar .sec,.nav span:not(.x),.addbtn span,.sendrow span,.roots{display:none}
  .nav,.sendrow{justify-content:center}
  .nowtext,.volwrap{display:none}
}
</style>
</head>
<body>

<div id="app">
  <div class="titlebar">
    <svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
    マイ・ミュージックライブラリー
  </div>

  <div class="transport">
    <button class="tbtn" id="btnShuffle" title="シャッフル：しない"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.5l-2 3-1.2-1.8L13.4 6H17V3zM3 6h4.6l7.9 12H21v-3l3 4-3 4v-3h-6.6L6.5 8H3V6zm0 12h4.6l2.2-3.3 1.2 1.8L8.6 20H3v-2z"/></svg></button>
    <button class="tbtn" id="btnPrev" title="前の曲"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12l-9-6z"/></svg></button>
    <button class="tbtn play" id="btnPlay" title="再生 / 一時停止"><svg id="icoPlay" viewBox="0 0 24 24"><path d="M7 5v14l12-7z"/></svg></button>
    <button class="tbtn" id="btnNext" title="次の曲"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6l9 6-9 6z"/></svg></button>
    <button class="tbtn" id="btnRepeat" title="リピート：しない"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>

    <div class="nowbox">
      <img class="nowart" id="nowArt" alt="" style="visibility:hidden">
      <div class="nowtext">
        <div class="nowtitle" id="nowTitle">再生していません</div>
        <div class="nowartist" id="nowArtist">—</div>
      </div>
      <div class="seekwrap">
        <span class="time" id="tCur">0:00</span>
        <input type="range" id="seek" value="0" min="0" max="1000" aria-label="再生位置">
        <span class="time" id="tAll">0:00</span>
        <div class="badges">
          <span class="badge" id="bXf">クロスフェード</span>
          <span class="badge" id="bLv">音量そろえ</span>
        </div>
      </div>
    </div>

    <div class="volwrap">
      <button class="tbtn" id="btnMute" title="ミュート"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4zm12.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4z"/></svg></button>
      <input type="range" id="vol" min="0" max="100" value="80" aria-label="音量">
    </div>
    <button class="tbtn" id="btnGear" title="再生の設定"><svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zm0 6a2 2 0 110-4 2 2 0 010 4zm8.4-2l1.8-1.4-1.8-3.1-2.2.8a7 7 0 00-1.5-.9L16.4 5h-3.6l-.3 2.4c-.5.2-1 .5-1.5.9l-2.2-.8-1.8 3.1L8.8 12c0 .6 0 1.1.1 1.4l-1.8 1.4 1.8 3.1 2.2-.8c.5.4 1 .7 1.5.9l.3 2.4h3.6l.3-2.4c.5-.2 1-.5 1.5-.9l2.2.8 1.8-3.1L20.4 13c.1-.3.1-.8 0-1z"/></svg></button>
  </div>

<script>
/* =========================================================
   楽曲管理ライブラリー
   ・音楽フォルダを「登録」して、次回起動時に自動で読み直す
   ・クロスフェード再生
   ・音量の自動そろえ（曲ごとの音量差をならす）
   ========================================================= */

const EXT = ['mp3','m4a','aac','flac','wav','ogg','oga','opus','wma','aiff','aif'];
const $ = s => document.querySelector(s);
const content = $('#content');
const TARGET_DB = -16;   // 音量そろえの目標値

const state = {
  tracks: [], covers: new Map(), coverBlobs: new Map(), playlists: [],
  roots: [], rootStatus: new Map(),   // フォルダ名 → 'ok' | 'need'
  view:'songs', plId:null, albumKey:null, artistName:null,
  query:'', sort:'title',
  queue:[], qIndex:-1, shuffle:false, repeat:'off',
  devices:[], selectedDevice:null,
  selectedAlbums: new Set()
};
const settings = { xfOn:true, xfSec:5, xfManual:true, normOn:true, vol:0.8 };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = sec => !isFinite(sec) || sec <= 0 ? '--:--' : Math.floor(sec/60)+':'+String(Math.floor(sec%60)).padStart(2,'0');
/* アルバムのグループ化は「アルバム名」だけを基準にする。
   （曲ごとにアーティストが違っても＝オムニバスや feat. 曲があっても、
   　同じアルバム名なら同じアルバムとしてまとめる） */
const albumKeyOf = t => String(t.album || '').trim().toLowerCase();
/* 表示用の代表アーティスト名：アルバムアーティストが全曲で一致すればそれを、
   なければ曲のアーティストが全曲で一致すればそれを、
   それも割れていれば「各種アーティスト」を表示する。 */
function albumArtistLabel(arr){
  const aas = [...new Set(arr.map(t => (t.albumArtist||'').trim()).filter(Boolean))];
  if (aas.length === 1) return aas[0];
  const arts = [...new Set(arr.map(t => t.artist))];
  if (arts.length === 1) return arts[0];
  return '各種アーティスト';
}
const byPath = p => state.tracks.find(t => t.path === p);

/* =========================================================
   保存庫（IndexedDB）
   ========================================================= */
let db = null, dbError = false;
function openDB(){
  return new Promise(res => {
    let rq;
    try{ rq = indexedDB.open('music-library', 3); }
    catch(e){ dbError = true; return res(null); }
    rq.onupgradeneeded = () => {
      const d = rq.result;
      if (!d.objectStoreNames.contains('tracks'))    d.createObjectStore('tracks', {keyPath:'path'});
      if (!d.objectStoreNames.contains('covers'))    d.createObjectStore('covers');
      if (!d.objectStoreNames.contains('playlists')) d.createObjectStore('playlists', {keyPath:'id'});
      if (!d.objectStoreNames.contains('kv'))        d.createObjectStore('kv');
    };
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => { dbError = true; res(null); };
  });
}
const tx = (s,m) => db.transaction(s,m).objectStore(s);
const putAll = (store, items, keys) => new Promise(res => {
  if (!db) return res();
  const t = db.transaction(store,'readwrite'), s = t.objectStore(store);
  items.forEach((it,i) => keys ? s.put(it, keys[i]) : s.put(it));
  t.oncomplete = res; t.onerror = res;
});
const getAll = store => new Promise(res => {
  if (!db) return res([]);
  const rq = tx(store,'readonly').getAll(); rq.onsuccess = () => res(rq.result); rq.onerror = () => res([]);
});
const getAllKeys = store => new Promise(res => {
  if (!db) return res([]);
  const rq = tx(store,'readonly').getAllKeys(); rq.onsuccess = () => res(rq.result); rq.onerror = () => res([]);
});
const getOne = (store,key) => new Promise(res => {
  if (!db) return res(null);
  const rq = tx(store,'readonly').get(key); rq.onsuccess = () => res(rq.result); rq.onerror = () => res(null);
});
const del = (store,key) => new Promise(res => {
  if (!db) return res();
  const t = db.transaction(store,'readwrite'); t.objectStore(store).delete(key);
  t.oncomplete = res; t.onerror = res;
});

const rec = t => ({path:t.path,title:t.title,artist:t.artist,album:t.album,albumArtist:t.albumArtist,
  track:t.track,year:t.year,genre:t.genre,duration:t.duration,addedAt:t.addedAt,edited:!!t.edited,
  gainDb:t.gainDb ?? null, loudDb:t.loudDb ?? null});
let saveTimer = null;
const saveTracks = () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => putAll('tracks', state.tracks.map(rec)), 500); };
const savePlaylists = () => putAll('playlists', state.playlists);
const saveSettings = () => putAll('kv', [settings], ['settings']);
const saveRoots = () => putAll('kv', [state.roots], ['roots']);

/* =========================================================
   1. 音楽フォルダの登録と自動読み直し
   ---------------------------------------------------------
   フォルダそのものへの「引換券」（ハンドル）を保存庫に入れておくと、
   次回起動時にブラウザが同じフォルダを開き直してくれます。
   ========================================================= */
const canPickDir = 'showDirectoryPicker' in window;

$('#btnAdd').onclick = async () => {
  if (!canPickDir){ $('#pickDir').click(); return; }
  try{
    const handle = await window.showDirectoryPicker({mode:'read', id:'musicRoot'});
    if (!state.roots.some(h => h.name === handle.name)) state.roots.push(handle);
    saveRoots();
    await scanRoot(handle, {announce:true});
  }catch(e){ /* 選択をやめた場合 */ }
};
$('#pickDir').onchange = e => {
  const items = [...e.target.files].map(f => ({file:f, path:f.webkitRelativePath || f.name}));
  e.target.value = '';
  ingest(items, {announce:true});
};

/* フォルダの中を隅々までたどる */
async function* walk(dir, prefix){
  for await (const [name, h] of dir.entries()){
    const p = prefix + '/' + name;
    if (h.kind === 'directory') yield* walk(h, p);
    else yield [p, h];
  }
}

async function scanRoot(handle, opt = {}){
  const items = [];
  try{
    for await (const [path, fh] of walk(handle, handle.name)){
      if (!EXT.includes((path.split('.').pop()||'').toLowerCase())) continue;
      items.push({fh, path});
    }
  }catch(e){ state.rootStatus.set(handle.name, 'need'); render(); return; }

  // File 本体は必要な分だけ取り出す
  const withFiles = [];
  for (const it of items){
    try{ withFiles.push({file: await it.fh.getFile(), path: it.path}); }catch(e){}
  }
  state.rootStatus.set(handle.name, 'ok');
  await ingest(withFiles, opt);
}

/* 保存済みフォルダを起動時に開き直す */
async function restoreRoots(){
  const roots = await getOne('kv','roots');
  if (!roots || !roots.length) return;
  state.roots = roots;
  for (const h of roots){
    let perm = 'prompt';
    try{ perm = await h.queryPermission({mode:'read'}); }catch(e){ perm = 'prompt'; }
    if (perm === 'granted') await scanRoot(h);
    else state.rootStatus.set(h.name, 'need');
  }
  render();
}

/* 許可が要るフォルダをまとめて開き直す（ボタン押下時に呼ぶ） */
async function grantRoots(){
  for (const h of state.roots){
    if (state.rootStatus.get(h.name) === 'ok') continue;
    try{
      const p = await h.requestPermission({mode:'read'});
      if (p === 'granted') await scanRoot(h);
    }catch(e){}
  }
  render();
}

/* =========================================================
   2. 取り込み（新規はタグ読み取り、既存はファイル再リンク）
   ========================================================= */
async function ingest(items, opt = {}){
  let relinked = 0;
  const fresh = [];
  for (const {file, path} of items){
    const ex = byPath(path);
    if (ex){ ex.file = file; measure(ex); relinked++; }
    else fresh.push({file, path});
  }

  if (fresh.length){
    const bar = makeBar('タグ情報を読み取り中…');
    let done = 0;
    for (let i = 0; i < fresh.length; i += 8){
      await Promise.all(fresh.slice(i, i+8).map(x => readOne(x.file, x.path).then(() => {
        bar.step(++done, fresh.length);
        if (done % 15 === 0) render();
      })));
    }
    bar.close();
  }
  saveTracks(); render();
  if (opt.announce && relinked && !fresh.length) toast(relinked + '曲のファイルを読み直しました。');
}

function makeBar(label){
  const el = document.createElement('div');
  el.className = 'loading';
  el.innerHTML = `<span>${label}</span><div class="track"><div class="fill"></div></div><span class="n"></span>`;
  document.body.appendChild(el);
  return {
    step(i, total){ el.querySelector('.fill').style.width = (i/total*100)+'%'; el.querySelector('.n').textContent = i+' / '+total; },
    close(){ el.remove(); }
  };
}
function toast(msg){
  const el = document.createElement('div');
  el.className = 'loading'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

/* =========================================================
   文字化けの自動修復
   ---------------------------------------------------------
   古いタグ付けソフトで書かれたMP3は、実際にはShift_JISや
   UTF-8のバイト列なのに「ISO-8859-1（1バイト＝1文字）」として
   タグが記録されていることがあり、その場合 jsmediatags は
   各バイトをそのままの文字コードとして読み込んでしまい、
   結果として文字化けした文字列になります。
   ここでは「文字コードが0x00〜0xFFに収まる＝1バイトずつ
   誤変換された疑いがある」文字列だけを対象に、元のバイト列に
   戻したうえでUTF-8→Shift_JIS→EUC-JPの順に読み直しを試み、
   日本語として意味の通る結果が得られたものだけ採用します。
   ========================================================= */
function fixMojibake(s){
  if (!s) return s;
  if (!/^[\x00-\xff]*$/.test(s)) return s;   // 既に本物の複数バイト文字が含まれる→触らない
  if (/^[\x00-\x7f]*$/.test(s)) return s;    // 純粋なASCIIは直す必要なし
  const bytes = Uint8Array.from([...s].map(c => c.charCodeAt(0)));
  const looksJapanese = t => /[぀-ヿ㐀-鿿]/.test(t);
  for (const enc of ['utf-8','shift_jis','euc-jp']){
    try{
      const t = new TextDecoder(enc, {fatal:true}).decode(bytes);
      if (looksJapanese(t)) return t;
    }catch(e){ /* このエンコーディングでは読めなかった */ }
  }
  return s;
}
function fixTrackText(t){
  let changed = false;
  for (const k of ['title','artist','album','albumArtist','genre']){
    const v = fixMojibake(t[k]);
    if (v !== t[k]){ t[k] = v; changed = true; }
  }
  return changed;
}

function readOne(file, path){
  return new Promise(resolve => {
    const base = {
      path, file,
      title: file.name.replace(/\.[^.]+$/, ''),
      artist:'不明なアーティスト', album:'不明なアルバム', albumArtist:'',
      track:0, year:'', genre:'', duration:0, addedAt:Date.now(), edited:false,
      gainDb:null, loudDb:null
    };
    const done = () => { state.tracks.push(base); measure(base); resolve(); };
    if (typeof jsmediatags === 'undefined') return done();
    jsmediatags.read(file, {
      onSuccess: ({tags}) => {
        if (tags.title)  base.title  = String(tags.title).trim();
        if (tags.artist) base.artist = String(tags.artist).trim();
        if (tags.album)  base.album  = String(tags.album).trim();
        base.albumArtist = String(tags.albumartist || tags.band || '').trim();
        base.track = parseInt(String(tags.track || '0').split('/')[0]) || 0;
        base.year  = String(tags.year || '');
        base.genre = String(tags.genre || '');
        fixTrackText(base);
        const key = albumKeyOf(base);
        if (tags.picture && !state.covers.has(key))
          setCover(key, new Blob([new Uint8Array(tags.picture.data)], {type: tags.picture.format || 'image/jpeg'}));
        done();
      },
      onError: done
    });
  });
}
function setCover(key, blob){
  const old = state.covers.get(key); if (old) URL.revokeObjectURL(old);
  state.coverBlobs.set(key, blob);
  state.covers.set(key, URL.createObjectURL(blob));
  putAll('covers', [blob], [key]);
}
/* アルバムのグループ化キーを「アーティスト＋アルバム名」から「アルバム名のみ」に
   変更したことに伴い、以前のキー形式で保存されたジャケット画像を
   新しいキーへコピーしておく（起動時に一度だけ実行）。 */
function migrateCoverKeys(){
  for (const t of state.tracks){
    const newKey = albumKeyOf(t);
    if (state.covers.has(newKey)) continue;
    const oldKey = (t.albumArtist || t.artist) + ' ▸ ' + t.album;
    const blob = state.coverBlobs.get(oldKey);
    if (blob) setCover(newKey, blob);
  }
}
function measure(t){
  if (!t.file || t.duration) return;
  const a = new Audio(), url = URL.createObjectURL(t.file);
  a.preload = 'metadata';
  a.onloadedmetadata = () => { t.duration = a.duration; URL.revokeObjectURL(url); saveTracks(); };
  a.onerror = () => URL.revokeObjectURL(url);
  a.src = url;
}

/* =========================================================
   3. 音量の自動そろえ
   ---------------------------------------------------------
   曲を丸ごと解析して平均音量（RMS）を測り、目標値との差を
   「補正値（デシベル）」として記録します。再生時にその分だけ
   音量を上げ下げすることで、曲ごとの音量差がならされます。
   一度測った結果は保存されるので、解析は曲ごとに1回だけです。
   ========================================================= */
let anaQueue = [], anaBusy = false;

async function analyzeTrack(t){
  if (!t.file || t.gainDb != null) return false;
  initAudio();
  if (!ac) return false;
  let buf;
  try{
    buf = await ac.decodeAudioData(await t.file.arrayBuffer());
  }catch(e){ t.gainDb = 0; t.loudDb = null; return true; }

  let sum = 0, cnt = 0, peak = 0;
  const step = 3;   // 3サンプルに1つだけ見て速度を稼ぐ
  for (let c = 0; c < buf.numberOfChannels; c++){
    const d = buf.getChannelData(c);
    for (let i = 0; i < d.length; i += step){
      const v = d[i];
      sum += v*v; cnt++;
      const a = v < 0 ? -v : v;
      if (a > peak) peak = a;
    }
  }
  const rms = Math.sqrt(sum / Math.max(1, cnt));
  const db = 20 * Math.log10(Math.max(rms, 1e-6));
  let g = TARGET_DB - db;
  if (peak > 0) g = Math.min(g, 20 * Math.log10(0.99 / peak));  // 音割れ防止
  t.loudDb = db;
  t.gainDb = Math.max(-15, Math.min(15, g));
  if (!t.duration) t.duration = buf.duration;
  return true;
}

function queueAnalyze(t){
  if (!t || !t.file || t.gainDb != null || anaQueue.includes(t)) return;
  anaQueue.push(t);
  runAnalyzeQueue();
}
async function runAnalyzeQueue(){
  if (anaBusy) return;
  anaBusy = true;
  while (anaQueue.length){
    const t = anaQueue.shift();
    await analyzeTrack(t);
    saveTracks();
    if (decks.length && active().path === t.path){ active().norm = normOf(t); applyFade(active()); }
  }
  anaBusy = false;
}
async function analyzeAll(){
  const list = state.tracks.filter(t => t.file && t.gainDb == null);
  if (!list.length) return;
  const bar = makeBar('音量を解析中…');
  for (let i = 0; i < list.length; i++){
    await analyzeTrack(list[i]);
    bar.step(i+1, list.length);
  }
  bar.close(); saveTracks(); render();
  toast(list.length + '曲の解析が終わりました。');
}
function normOf(t){
  if (!settings.normOn || !t || t.gainDb == null) return 1;
  return Math.max(0.2, Math.min(4, Math.pow(10, t.gainDb / 20)));
}

/* =========================================================
   4. 再生装置（2台構成・クロスフェード）
   ========================================================= */
let ac = null, master = null;
const decks = [];
let cur = 0, xfBusy = false;

function initAudio(){
  if (decks.length) return;
  try{
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain();
    master.gain.value = settings.vol;
    master.connect(ac.destination);
  }catch(e){ ac = null; }

  for (let i = 0; i < 2; i++){
    const el = new Audio(); el.preload = 'auto';
    const d = {el, gain:null, fade:0, norm:1, raf:0, url:null, path:null};
    if (ac){
      const src = ac.createMediaElementSource(el);
      d.gain = ac.createGain(); d.gain.gain.value = 0;
      src.connect(d.gain); d.gain.connect(master);
    } else el.volume = 0;
    decks.push(d);
  }
  decks.forEach((d, i) => {
    d.el.ontimeupdate = () => { if (i === cur) onTick(d); };
    d.el.onended = () => { if (i === cur && !xfBusy) advance(true); };
    d.el.onplay  = () => { if (i === cur) setPlayIcon(true); };
    d.el.onpause = () => { if (i === cur && !xfBusy) setPlayIcon(false); };
  });
}

function applyFade(d){
  const f = Math.sin(Math.max(0, Math.min(1, d.fade)) * Math.PI / 2);  // 等パワー曲線
  const v = f * d.norm;
  if (d.gain) d.gain.gain.value = v;
  else d.el.volume = Math.min(1, v * settings.vol);
}
function fadeTo(d, to, sec, onEnd){
  cancelAnimationFrame(d.raf);
  const from = d.fade, t0 = performance.now(), ms = Math.max(0, sec) * 1000;
  if (ms < 16){ d.fade = to; applyFade(d); onEnd && onEnd(); return; }
  const tick = now => {
    const k = Math.min(1, (now - t0) / ms);
    d.fade = from + (to - from) * k;
    applyFade(d);
    if (k < 1) d.raf = requestAnimationFrame(tick); else onEnd && onEnd();
  };
  d.raf = requestAnimationFrame(tick);
}
function loadDeck(d, t){
  if (d.url) URL.revokeObjectURL(d.url);
  d.url = URL.createObjectURL(t.file);
  d.el.src = d.url;
  d.path = t.path;
  d.norm = normOf(t);
}
const active = () => decks[cur];
const idle   = () => decks[1 - cur];
const currentPath = () => state.queue[state.qIndex] ?? null;

function playFrom(list, path){
  const t = byPath(path);
  if (t && !t.file){ needFilesAlert(); return; }
  state.queue = list.map(x => x.path);
  state.qIndex = state.queue.indexOf(path);
  startCurrent(0.25);
}
function needFilesAlert(){
  alert('この曲のファイルがまだ読み込まれていません。\n画面上部の案内から音楽フォルダを開き直してください。');
}

function startCurrent(fadeSec){
  initAudio(); ac && ac.resume();
  const t = byPath(currentPath());
  if (!t || !t.file) return;
  const other = idle();
  cancelAnimationFrame(other.raf);
  fadeTo(other, 0, Math.min(fadeSec, .25), () => other.el.pause());

  const d = active();
  loadDeck(d, t);
  d.fade = 0; applyFade(d);
  d.el.play().catch(()=>{});
  fadeTo(d, 1, fadeSec);
  xfBusy = false; badge('#bXf', false);
  afterStart(t);
}
function afterStart(t){
  updateNowText(t);
  badge('#bLv', settings.normOn && t.gainDb != null);
  queueAnalyze(t);
  const n = peekNext();
  if (n >= 0) queueAnalyze(byPath(state.queue[n]));
  render();
}
const badge = (sel, on) => $(sel).classList.toggle('show', !!on);

function peekNext(){
  if (!state.queue.length) return -1;
  if (state.repeat === 'one') return state.qIndex;
  if (state.shuffle){
    if (state.queue.length === 1) return state.qIndex;
    let n; do { n = Math.floor(Math.random() * state.queue.length); } while (n === state.qIndex);
    return n;
  }
  if (state.qIndex < state.queue.length - 1) return state.qIndex + 1;
  if (state.repeat === 'all') return 0;
  return -1;
}

function crossfade(sec){
  const n = peekNext();
  if (n < 0) return false;
  const t = byPath(state.queue[n]);
  if (!t || !t.file) return false;

  initAudio(); ac && ac.resume();
  xfBusy = true; badge('#bXf', true);

  const outDeck = active(), inDeck = idle();
  loadDeck(inDeck, t);
  inDeck.fade = 0; applyFade(inDeck);
  inDeck.el.play().catch(()=>{});
  fadeTo(inDeck, 1, sec);
  fadeTo(outDeck, 0, sec, () => { outDeck.el.pause(); outDeck.el.currentTime = 0; });

  cur = 1 - cur;
  state.qIndex = n;
  setTimeout(() => { xfBusy = false; badge('#bXf', false); }, sec * 1000 + 60);
  afterStart(t);
  return true;
}
function advance(auto){
  const sec = settings.xfOn && (auto || settings.xfManual) ? settings.xfSec : 0.2;
  if (!crossfade(sec)){
    fadeTo(active(), 0, 0.2, () => active().el.pause());
    setPlayIcon(false);
  }
}
function onTick(d){
  const dur = d.el.duration;
  if (!dur || !isFinite(dur)) return;
  const p = d.el.currentTime / dur, s = $('#seek');
  s.value = p * 1000; s.style.setProperty('--p', (p*100)+'%');
  $('#tCur').textContent = fmt(d.el.currentTime);
  $('#tAll').textContent = fmt(dur);
  if (settings.xfOn && !xfBusy && !d.el.paused){
    const remain = dur - d.el.currentTime;
    if (remain <= settings.xfSec && remain > 0.15) crossfade(Math.min(settings.xfSec, remain));
  }
}
const setPlayIcon = p => $('#icoPlay').innerHTML = p ? '<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>' : '<path d="M7 5v14l12-7z"/>';

function updateNowText(t){
  $('#nowTitle').textContent = t.title;
  $('#nowArtist').textContent = t.artist + ' — ' + t.album;
  const cover = state.covers.get(albumKeyOf(t)), art = $('#nowArt');
  if (cover){ art.src = cover; art.style.visibility = 'visible'; }
  else { art.removeAttribute('src'); art.style.visibility = 'hidden'; }
}

$('#btnPlay').onclick = () => {
  if (!decks.length || !active().path){
    const list = filtered().filter(t => t.file);
    if (list.length) playFrom(list, list[0].path); else needFilesAlert();
    return;
  }
  const d = active();
  if (d.el.paused){ ac && ac.resume(); d.el.play(); fadeTo(d, 1, 0.3); }
  else fadeTo(d, 0, 0.3, () => { d.el.pause(); setPlayIcon(false); });
};
$('#btnNext').onclick = () => advance(false);
$('#btnPrev').onclick = () => {

$('#btnShuffle').onclick = e => {

function filtered(src){
  let list = src || state.tracks;
  if (state.query){
    const q = state.query;
    list = list.filter(t => t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q) || t.album.toLowerCase().includes(q));
  }
  const by = {
    title:(a,b)=>a.title.localeCompare(b.title,'ja'),
    artist:(a,b)=>a.artist.localeCompare(b.artist,'ja')||a.title.localeCompare(b.title,'ja'),
    album:(a,b)=>a.album.localeCompare(b.album,'ja')||a.track-b.track,
    added:(a,b)=>b.addedAt-a.addedAt
  }[state.sort];
  return [...list].sort(by);

/* =========================================================
   アルバムのドラッグ選択・まとめて削除
   ---------------------------------------------------------
   グリッドの何もない場所からドラッグすると矩形が現れ、
   触れたアルバムをまとめて選択できます（Ctrl+クリックで1件ずつ追加も可）。
   ========================================================= */
let justDraggedAlbums = false;
function renderAlbumSelectionUI(){
  const bar = $('#albumSelBar'); if (!bar) return;
  const n = state.selectedAlbums.size;
  bar.style.display = n ? 'flex' : 'none';
  const cnt = $('#albumSelCount'); if (cnt) cnt.textContent = n;
  content.querySelectorAll('.card[data-album]').forEach(c => {
    c.classList.toggle('sel', state.selectedAlbums.has(c.dataset.album));
  });
}
function bindAlbumDragSelect(){
  const grid = content.querySelector('.grid');
  if (!grid) return;
  grid.onmousedown = e => {
    if (e.button !== 0) return;
    const onCard = e.target.closest('.card');
    // アルバムの上から始めても、動かせばドラッグ選択になる（動かさなければ通常クリックとして開く）
    e.preventDefault();
    const additive = e.ctrlKey || e.metaKey;
    const startX = e.clientX, startY = e.clientY;
    let moved = false, rectEl = null;
    const onMove = ev => {
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      if (!moved && Math.hypot(dx, dy) > 4){
        moved = true;
        rectEl = document.createElement('div');
        rectEl.className = 'selrect';
        document.body.appendChild(rectEl);
        if (!additive) state.selectedAlbums.clear();
      }
      if (!moved) return;
      const x = Math.min(ev.clientX, startX), y = Math.min(ev.clientY, startY);
      const w = Math.abs(dx), h = Math.abs(dy);
      Object.assign(rectEl.style, {left:x+'px', top:y+'px', width:w+'px', height:h+'px'});
      const rect = {left:x, top:y, right:x+w, bottom:y+h};
      grid.querySelectorAll('.card').forEach(c => {
        const r = c.getBoundingClientRect();
        const hit = !(r.right < rect.left || r.left > rect.right || r.bottom < rect.top || r.top > rect.bottom);
        const key = c.dataset.album;
        if (hit) state.selectedAlbums.add(key);
        else if (!additive) state.selectedAlbums.delete(key);
      });
      renderAlbumSelectionUI();
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      if (rectEl) rectEl.remove();
      if (!moved && onCard && additive){
        const key = onCard.dataset.album;
        if (state.selectedAlbums.has(key)) state.selectedAlbums.delete(key);
        else state.selectedAlbums.add(key);
        renderAlbumSelectionUI();
      } else if (!moved && !onCard){
        state.selectedAlbums.clear();
        renderAlbumSelectionUI();
      }
      justDraggedAlbums = moved;
      setTimeout(() => { justDraggedAlbums = false; }, 0);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  };
  // 右クリックで、選択中のアルバムをまとめて削除する。
  // 選択に入っていないアルバムを右クリックした場合はそのアルバムだけを対象にする。
  grid.oncontextmenu = e => {
    e.preventDefault();
    const onCard = e.target.closest('.card');
    if (!onCard){
      if (!state.selectedAlbums.size) return;
      deleteSelectedAlbums();
      return;
    }
    const key = onCard.dataset.album;
    if (!state.selectedAlbums.has(key)){
      state.selectedAlbums.clear();
      state.selectedAlbums.add(key);
      renderAlbumSelectionUI();
    }
    deleteSelectedAlbums();
  };
}
function deleteSelectedAlbums(){
  const keys = [...state.selectedAlbums];
  if (!keys.length) return;
  const map = groupAlbums();
  const tracks = keys.flatMap(k => map.get(k) || []);
  if (!tracks.length) return;
  const names = keys.map(k => (map.get(k)||[])[0]?.album || k).slice(0,3).join('、');
  const more = keys.length > 3 ? ` 他${keys.length-3}件` : '';
  if (!confirm(`${keys.length}件のアルバム（${names}${more}）、あわせて${tracks.length}曲をまとめてライブラリから削除しますか？\n（パソコン上のファイルは消えません）`)) return;
  const pathSet = new Set(tracks.map(t => t.path));
  state.tracks = state.tracks.filter(t => !pathSet.has(t.path));
  state.playlists.forEach(p => p.paths = p.paths.filter(pp => !pathSet.has(pp)));
  tracks.forEach(t => del('tracks', t.path));
  savePlaylists();
  state.selectedAlbums.clear();
  render();
}
function viewAlbumDetail(){
  const arr = groupAlbums().get(state.albumKey) || [];
  if (!arr.length){ state.albumKey = null; return render(); }
  const t = arr[0], total = arr.reduce((s,x)=>s+(x.duration||0),0);
  content.innerHTML = `
    <div class="detail">
      ${jacketImg(t,'jacket')}
      <div class="dinfo">
        <h2>${esc(t.album)}</h2>
        <div class="meta">${esc(albumArtistLabel(arr))}${t.year ? ' ・ ' + esc(t.year) : ''} ・ ${arr.length}曲 ・ ${fmt(total)}</div>
        <button class="pill primary" id="pAll"><svg viewBox="0 0 24 24"><path d="M7 5v14l12-7z"/></svg>すべて再生</button>
        <button class="pill ghost" id="pAdd">プレイリストに追加</button>
      </div>
    </div>
    ${songTableHTML(arr, {noHead:true, noArt:true, useTrackNo:true})}`;
  bindSongTable(arr, {});
  $('#pAll').onclick = () => playFrom(arr, arr[0].path);
  $('#pAdd').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); playlistMenu(r.left, r.bottom + 6, arr.map(x=>x.path)); };
  $('#vTitle').textContent = t.album; $('#vSub').textContent = arr.length + ' 曲';
}
function viewArtists(){
  const map = new Map();
  filtered().forEach(t => { if (!map.has(t.artist)) map.set(t.artist, []); map.get(t.artist).push(t); });
  $('#vSub').textContent = map.size + ' アーティスト';
  content.innerHTML = `<div class="grid">${[...map].map(([name,arr]) => `
    <div class="card" data-artist="${esc(name)}" tabindex="0">
      ${jacketImg(arr[0],'jacket')}<div class="ctitle">${esc(name)}</div><div class="csub">${arr.length}曲</div>
    </div>`).join('')}</div>`;
  content.querySelectorAll('[data-artist]').forEach(c => c.onclick = () => { state.artistName = c.dataset.artist; render(); });
}
function viewArtistDetail(){
  viewSongs(filtered().filter(t => t.artist === state.artistName));
  $('#vTitle').textContent = state.artistName;
}

/* =========================================================
   7. プレイリスト
   ========================================================= */
function renderPlaylistNav(){
  const box = $('#plList');
  box.innerHTML = state.playlists.map(p => `
    <button class="nav ${state.plId === p.id ? 'active' : ''}" data-pl="${p.id}">
      <svg viewBox="0 0 24 24"><path d="M4 7h12M4 12h12M4 17h8"/><path d="M18 9v8l4-4z"/></svg>
      <span>${esc(p.name)}</span><span class="x" title="削除">×</span>
    </button>`).join('') || '<div class="sec" style="padding-top:4px;opacity:.7">まだありません</div>';

  box.querySelectorAll('[data-pl]').forEach(b => {
    b.onclick = e => {
      const p = state.playlists.find(x => x.id === b.dataset.pl);
      if (e.target.classList.contains('x')){
        e.stopPropagation();
        if (confirm(`プレイリスト「${p.name}」を削除しますか？（曲そのものは消えません）`)){
          state.playlists = state.playlists.filter(x => x.id !== p.id);
          del('playlists', p.id);
          if (state.plId === p.id){ state.plId = null; state.view = 'songs'; }
          render();
        }
        return;
      }
      state.view = 'playlist'; state.plId = p.id; state.albumKey = state.artistName = null;
      setActive(b); render();
    };
  });
}
$('#btnNewPl').onclick = () => {
  const name = prompt('プレイリストの名前を入力してください', '新しいプレイリスト');
  if (!name) return;
  state.playlists.push({id:'pl'+Date.now(), name:name.trim(), paths:[], createdAt:Date.now()});
  savePlaylists(); render();
};
function viewPlaylist(){
  const p = state.playlists.find(x => x.id === state.plId);
  if (!p){ state.view = 'songs'; return render(); }
  const list = p.paths.map(byPath).filter(Boolean);
  $('#vTitle').textContent = p.name;
  if (!list.length){
    content.innerHTML = `<div class="empty"><p>このプレイリストは空です。</p>
      <p class="hint">曲一覧で「⋯」→「プレイリストに追加」から曲を入れられます。</p></div>`;
    return;
  }
  content.innerHTML = `
    <div style="margin-bottom:16px">
      <button class="pill primary" id="plPlay"><svg viewBox="0 0 24 24"><path d="M7 5v14l12-7z"/></svg>すべて再生</button>
      <button class="pill ghost" id="plRename">名前を変更</button>
    </div>${songTableHTML(list)}`;
  bindSongTable(list, {playlistId:p.id});
  $('#plPlay').onclick = () => playFrom(list, list[0].path);
  $('#plRename').onclick = () => { const n = prompt('新しい名前', p.name); if (n){ p.name = n.trim(); savePlaylists(); render(); } };
  $('#vTitle').textContent = p.name; $('#vSub').textContent = list.length + ' 曲';
}

/* =========================================================
   8. メニュー
   ========================================================= */
let menuEl = null;
const closeMenu = () => { menuEl?.remove(); menuEl = null; };
document.addEventListener('click', e => { if (menuEl && !menuEl.contains(e.target)) closeMenu(); });
function showMenu(x, y, html){
  closeMenu();
  menuEl = document.createElement('div');
  menuEl.className = 'menu'; menuEl.innerHTML = html;
  document.body.appendChild(menuEl);
  const r = menuEl.getBoundingClientRect();
  menuEl.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 8)) + 'px';
  menuEl.style.top  = Math.max(8, Math.min(y, innerHeight - r.height - 8)) + 'px';
  return menuEl;
}
function trackMenu(x, y, t, list, opt){
  const m = showMenu(x, y, `
    <button data-a="play">再生</button>
    <button data-a="next">次に再生</button>
    <hr>
    <button data-a="add">プレイリストに追加…</button>
    ${opt.playlistId ? '<button data-a="rm">このプレイリストから外す</button>' : ''}
    <hr>
    <button data-a="edit">曲の情報を編集…</button>
    <button data-a="ana">音量を測り直す</button>
    <button data-a="del">ライブラリから削除</button>`);
  m.onclick = e => {
    const a = e.target.dataset.a; if (!a) return;
    closeMenu();
    if (a === 'play') playFrom(list, t.path);
    if (a === 'next'){
      if (state.qIndex < 0) playFrom(list, t.path);
      else { state.queue.splice(state.qIndex + 1, 0, t.path); render(); }
    }
    if (a === 'add') playlistMenu(x, y, [t.path]);
    if (a === 'rm'){
      const p = state.playlists.find(z => z.id === opt.playlistId);
      p.paths = p.paths.filter(pp => pp !== t.path); savePlaylists(); render();
    }
    if (a === 'edit') openEditor(t);
    if (a === 'ana'){ t.gainDb = null; queueAnalyze(t); }
    if (a === 'del'){
      if (!confirm(`「${t.title}」をライブラリから削除しますか？\n（パソコン上のファイルは消えません）`)) return;
      state.tracks = state.tracks.filter(z => z !== t);
      state.playlists.forEach(p => p.paths = p.paths.filter(pp => pp !== t.path));
      del('tracks', t.path); savePlaylists(); render();
    }
  };
}
function playlistMenu(x, y, paths){
  const m = showMenu(x, y, `
    <div class="head">プレイリストに追加</div>
    ${state.playlists.map(p => `<button data-id="${p.id}">${esc(p.name)}</button>`).join('') || '<div class="head">まだありません</div>'}
    <hr><button data-id="__new">＋ 新規作成して追加</button>`);
  m.onclick = e => {
    const id = e.target.dataset.id; if (!id) return;
    closeMenu();
    let p;
    if (id === '__new'){
      const name = prompt('プレイリストの名前', '新しいプレイリスト');
      if (!name) return;
      p = {id:'pl'+Date.now(), name:name.trim(), paths:[], createdAt:Date.now()};
      state.playlists.push(p);
    } else p = state.playlists.find(z => z.id === id);
    paths.forEach(pp => { if (!p.paths.includes(pp)) p.paths.push(pp); });
    savePlaylists(); render();
  };
}

/* =========================================================
   9. 曲情報の編集
   ========================================================= */
function openEditor(t){
  const mask = document.createElement('div');
  mask.className = 'mask';
  mask.innerHTML = `
    <div class="dlg" role="dialog" aria-label="曲の情報を編集">
      <h3>曲の情報を編集</h3>
      <div class="in">
        <div class="artbox">
          ${jacketImg(t,'jacket')}
          <button class="btn ghost" id="eArt" style="width:100%;font-size:12px;padding:7px">画像を変更</button>
          <input type="file" id="eArtFile" accept="image/*" hidden>
        </div>
        <div class="fields">
          <div class="fld"><label>曲名</label><input id="eTitle" value="${esc(t.title)}"></div>
          <div class="fld"><label>アーティスト</label><input id="eArtist" value="${esc(t.artist)}"></div>
          <div class="fld"><label>アルバム</label><input id="eAlbum" value="${esc(t.album)}"></div>
          <div class="fld"><label>アルバムアーティスト（空欄ならアーティストと同じ）</label><input id="eAA" value="${esc(t.albumArtist)}"></div>
          <div class="row2">
            <div class="fld"><label>トラック番号</label><input id="eTrack" type="number" min="0" value="${t.track||''}"></div>
            <div class="fld"><label>年</label><input id="eYear" value="${esc(t.year)}"></div>
          </div>
          <div class="fld"><label>ジャンル</label><input id="eGenre" value="${esc(t.genre)}"></div>
        </div>
      </div>
      <p class="tip">※ここでの編集はこのライブラリの中だけに保存されます。パソコン上の音楽ファイルそのものは書き換えません。<br>
      ジャケット画像はアルバム単位で共有されるため、変更すると同じアルバムの曲すべてに反映されます。</p>
      <div class="foot">
        <button class="btn ghost" id="eCancel">キャンセル</button>
        <button class="btn primary" id="eSave">保存</button>
      </div>
    </div>`;
  document.body.appendChild(mask);

  let newArt = null;
  $('#eArt').onclick = () => $('#eArtFile').click();
  $('#eArtFile').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    newArt = f;
    const img = mask.querySelector('.artbox .jacket'), url = URL.createObjectURL(f);
    if (img.tagName === 'IMG') img.src = url; else img.outerHTML = `<img class="jacket" src="${url}" alt="">`;
  };
  const close = () => mask.remove();
  $('#eCancel').onclick = close;
  mask.onclick = e => { if (e.target === mask) close(); };
  document.addEventListener('keydown', function k(e){ if (e.key === 'Escape'){ close(); document.removeEventListener('keydown', k); } });

  $('#eSave').onclick = () => {
    t.title = $('#eTitle').value.trim() || t.title;
    t.artist = $('#eArtist').value.trim() || '不明なアーティスト';
    t.album = $('#eAlbum').value.trim() || '不明なアルバム';
    t.albumArtist = $('#eAA').value.trim();
    t.track = parseInt($('#eTrack').value) || 0;
    t.year = $('#eYear').value.trim();
    t.genre = $('#eGenre').value.trim();
    t.edited = true;
    if (newArt) setCover(albumKeyOf(t), newArt);
    saveTracks(); close(); render();
    if (t.path === currentPath()) updateNowText(t);
  };
}

/* =========================================================
   10. 機器へ転送
   ---------------------------------------------------------
   ・アプリ本体（Python側）が、USBメモリやウォークマンなど
     「リムーバブルドライブ」として接続された機器を自動検出します。
   ・機器を選んで「転送」を押すと、曲のデータをアプリ経由で
     直接書き込みます（毎回フォルダを選び直す必要がありません）。
   ・ブラウザ単体で開いている場合など、機器の自動検出ができない
     環境では、従来どおりフォルダを選んで書き出す方法を使います。
   ========================================================= */
const hasDeviceApi = () => !!(window.pywebview && window.pywebview.api && window.pywebview.api.list_devices);
let deviceTimer = null;

function startDeviceWatch(){
  stopDeviceWatch();
  refreshDevices();
  deviceTimer = setInterval(refreshDevices, 2500);
}
function stopDeviceWatch(){ if (deviceTimer){ clearInterval(deviceTimer); deviceTimer = null; } }
async function refreshDevices(){
  if (!hasDeviceApi()) return;
  try{
    const list = await window.pywebview.api.list_devices();
    const before = JSON.stringify(state.devices.map(d=>d.letter));
    state.devices = list || [];
    if (state.selectedDevice && !state.devices.some(d => d.letter === state.selectedDevice)) state.selectedDevice = null;
    if (JSON.stringify(state.devices.map(d=>d.letter)) !== before && state.view === 'transfer') renderDeviceList();
  }catch(e){ /* 検出に失敗しても静かに諦める */ }
}
function fmtBytes(n){
  if (!n && n !== 0) return '';
  const gb = n / (1024**3);
  return gb >= 1 ? gb.toFixed(1) + ' GB' : (n/(1024**2)).toFixed(0) + ' MB';
}
function renderDeviceList(){
  const box = $('#devBox'); if (!box) return;
  if (!state.devices.length){
    box.innerHTML = `<div class="devwait"><span class="spin"></span>USB機器を待っています…（USBメモリやウォークマンなどを接続してください）</div>`;
    return;
  }
  box.innerHTML = `<div class="devices">${state.devices.map(d => {
    const used = d.totalBytes ? Math.min(100, Math.round((1 - d.freeBytes/d.totalBytes) * 100)) : 0;
    return `<button class="devcard ${state.selectedDevice===d.letter?'sel':''}" data-dev="${esc(d.letter)}">
      <div class="dname"><svg viewBox="0 0 24 24"><path d="M3 12h11M10 8l4 4-4 4M17 4h4v16h-4"/></svg>${esc(d.label)}（${esc(d.letter)}）</div>
      <div class="dmeta">空き容量 ${fmtBytes(d.freeBytes)} / ${fmtBytes(d.totalBytes)}</div>
      <div class="dbar"><i style="width:${used}%"></i></div>
    </button>`;
  }).join('')}</div>`;
  box.querySelectorAll('[data-dev]').forEach(b => b.onclick = () => {
    state.selectedDevice = b.dataset.dev === state.selectedDevice ? null : b.dataset.dev;
    renderDeviceList();
    updateSendButton();
  });
}
function updateSendButton(){
  const btn = $('#doSendDevice'); if (!btn) return;
  btn.disabled = !state.selectedDevice;
}

function viewTransfer(){
  const linked = state.tracks.filter(t => t.file);
  content.innerHTML = `
    <div class="panel">
      <h2>機器へ転送</h2>
      <p>ウォークマン、USBメモリ、SDカードなどをパソコンに接続すると、下に自動で表示されます。
      機器を選んで「選んだ機器へ転送」を押すと、<code>アーティスト名 / アルバム名 / 曲名</code> の形でコピーします。</p>
      <div id="devBox"></div>
      <div class="fld" style="max-width:280px;margin-bottom:16px">
        <label>転送する範囲</label>
        <select id="sendScope">
          <option value="all">ライブラリ全曲（${linked.length}曲）</option>
          ${state.playlists.map(p => `<option value="${p.id}">プレイリスト：${esc(p.name)}（${p.paths.length}曲）</option>`).join('')}
        </select>
      </div>
      <button class="btn primary" id="doSendDevice" disabled>選んだ機器へ転送</button>
      ${canPickDir ? '<button class="btn ghost" id="doSend" style="margin-left:8px">他のフォルダを選んで書き出す</button>' : ''}
      <div id="sendlog"></div>
    </div>`;

  if (hasDeviceApi()){
    renderDeviceList();
    startDeviceWatch();
  } else {
    $('#devBox').innerHTML = `<div class="note" style="margin:0 0 16px">
      <strong>この環境では機器の自動検出ができません。</strong><br>
      アプリ（MusicLibrary.exe）から起動すると、USB機器が自動で一覧に出てきます。
      ${canPickDir ? '今は下の「他のフォルダを選んで書き出す」から手動で書き出せます。' : 'Chrome または Edge でローカルサーバー経由（http://localhost…）で開くと手動での書き出しもできます。'}
    </div>`;
  }
  updateSendButton();

  $('#doSendDevice').onclick = async () => {
    const scope = $('#sendScope').value;
    const targets = (scope === 'all' ? state.tracks
      : (state.playlists.find(p => p.id === scope)?.paths || []).map(byPath).filter(Boolean)
    ).filter(t => t.file);
    if (!targets.length){ $('#sendlog').textContent = '転送できる曲がありません。'; return; }
    if (!state.selectedDevice){ $('#sendlog').textContent = '機器を選んでください。'; return; }
    const log = $('#sendlog');
    let n = 0, failed = 0;
    for (const t of targets){
      const relPath = safe(t.albumArtist || t.artist) + '/' + safe(t.album) + '/' +
        (t.track ? String(t.track).padStart(2,'0') + ' ' : '') + safe(t.title) + '.' + t.file.name.split('.').pop();
      try{
        const dataUrl = await fileToDataURL(t.file);
        const res = await window.pywebview.api.write_file(state.selectedDevice, relPath, dataUrl);
        if (res && res.ok) n++; else failed++;
      }catch(e){ failed++; }
      log.textContent = `転送中… ${n + failed} / ${targets.length}${failed ? `（失敗 ${failed}）` : ''}`;
    }
    log.textContent = failed ? `${n}曲を転送しました。（${failed}曲は失敗しました）` : `${n}曲を転送しました。`;
    refreshDevices();
  };

  if (!canPickDir) return;
  $('#doSend').onclick = async () => {
    const scope = $('#sendScope').value;
    const targets = (scope === 'all' ? state.tracks
      : (state.playlists.find(p => p.id === scope)?.paths || []).map(byPath).filter(Boolean)
    ).filter(t => t.file);
    if (!targets.length){ $('#sendlog').textContent = '転送できる曲がありません。'; return; }
    const log = $('#sendlog');
    try{
      const dir = await window.showDirectoryPicker({mode:'readwrite'});
      let n = 0;
      for (const t of targets){
        const a = await dir.getDirectoryHandle(safe(t.albumArtist || t.artist), {create:true});
        const b = await a.getDirectoryHandle(safe(t.album), {create:true});
        const num = t.track ? String(t.track).padStart(2,'0') + ' ' : '';
        const fh = await b.getFileHandle(safe(num + t.title) + '.' + t.file.name.split('.').pop(), {create:true});
        const w = await fh.createWritable();
        await w.write(await t.file.arrayBuffer());
        await w.close();
        log.textContent = `転送中… ${++n} / ${targets.length}`;
      }
      log.textContent = `${n}曲を転送しました。`;
    }catch(err){ log.textContent = '転送を中止しました。（' + err.message + '）'; }
  };
}
function fileToDataURL(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
const safe = s => String(s).replace(/[\\/:*?"<>|]/g, '_').trim().slice(0,80) || '_';

/* =========================================================
   起動
   ========================================================= */
window.addEventListener('pywebviewready', () => { if (state.view === 'transfer'){ startDeviceWatch(); renderDeviceList(); } });

(async function boot(){
  db = await openDB();
  if (db){
    const [trs, pls, covKeys, st] = await Promise.all([getAll('tracks'), getAll('playlists'), getAllKeys('covers'), getOne('kv','settings')]);
    state.tracks = trs.map(t => ({...t, file:null}));
    let healed = false;
    state.tracks.forEach(t => { if (fixTrackText(t)) healed = true; });
    if (healed) saveTracks();   // 既に保存済みの文字化けもここで直しておく
    state.playlists = pls;
    if (st) Object.assign(settings, st);
    for (const k of covKeys){
      const blob = await getOne('covers', k);
      if (blob){ state.coverBlobs.set(k, blob); state.covers.set(k, URL.createObjectURL(blob)); }
    }
    migrateCoverKeys();   // アルバムのグループ化キー変更に合わせ、既存ジャケット画像を引き継ぐ
  }
  applyVolumeUI();
  render();
  await restoreRoots();   // 登録フォルダを自動で開き直す
})();
</script>
